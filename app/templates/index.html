{% extends 'base.html' %}
{% block title %}CannaLog{% endblock %}
{% block body %}
<main class="auth">
  <div class="auth__panel">
    <img class="auth__logo" src="static/assets/logo.png" alt="CannaLog">
    <p style="text-align:center;color:var(--muted)">Dein Grow-Tagebuch für Pflanzen, Zelte, Messwerte und Fotos.</p>
    <div class="btn-row" style="justify-content:center">
      <a href="login" class="btn btn--primary">Anmelden</a>
      {% if ALLOW_REGISTRATION %}<a href="register" class="btn">Konto erstellen</a>{% endif %}
    </div>
  </div>
</main>
{% endblock %}
